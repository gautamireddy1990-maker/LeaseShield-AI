services:
  backend:
    build: { context: ., dockerfile: backend/Dockerfile }
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      LEASESHIELD_UPLOAD_DIR: /tmp/leaseshield-uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      CORS_ORIGINS: ${FRONTEND_URL:-http://localhost:3000}
      LLM_API_KEY: ${OPENAI_API_KEY}
    volumes: [leaseshield_tmp:/tmp/leaseshield-uploads]
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on: [backend]
volumes:
  leaseshield_tmp:
